# ============================================================================
#  SEssentials — Sourby Essentials
#  Folia-safe essentials suite. Every value below has a safe default; you only
#  need to set what you want to change. Text values accept MiniMessage tags
#  (e.g. <gold>, <gradient:...>) and legacy '&' colour codes.
# ============================================================================

# Chat prefix for plugin messages (MiniMessage / legacy '&' both accepted).
prefix: "<gradient:#43C6AC:#4FC3F7><bold>SEssentials</bold></gradient> <dark_gray>» "

# ----------------------------------------------------------------------------
#  Module toggles
#  Every feature module is ON by default. To disable one, add its name here set
#  to false — e.g. to turn off the fun and lottery modules:
#     modules:
#       fun: false
#       lottery: false
#  Module names are the lowercase group names (home, warp, economy, moderation,
#  chat, hpbar, kits, worldtime, …). A disabled module registers no commands or
#  listeners. Anything not listed stays enabled.
# ----------------------------------------------------------------------------
modules: {}

# ----------------------------------------------------------------------------
#  Homes & warps
# ----------------------------------------------------------------------------

# Homes (/home, /sethome, /homes GUI).
home:
  # Default max homes. Override per-rank with the permission sessentials.homes.<n>
  # (e.g. sessentials.homes.10 allows ten). The highest matching node wins.
  default-max: 3
  # Sleeping in a bed auto-saves a home named "bed" there (bedhome module). This
  # reserved home is overwritten each sleep and bypasses the max-home limit.
  bed-home: true

# Kits (/kit, /kits GUI).
kits:
  # Default per-kit cooldown in seconds when a kit doesn't set its own.
  default-cooldown: 3600

# Random teleport (/rtp, in the utility2 module).
rtp:
  # Maximum horizontal distance (blocks) from world origin for a random landing.
  radius: 5000

# ----------------------------------------------------------------------------
#  Info commands (/rules, /motd). Lines are MiniMessage.
# ----------------------------------------------------------------------------
info:
  rules:
    - "<gradient:#43C6AC:#4FC3F7><bold>ꜱᴏᴜʀʙʏᴄʀᴀꜰᴛ ʀᴜʟᴇꜱ</bold></gradient>"
    - "<gray>1. ʙᴇ ʀᴇꜱᴘᴇᴄᴛꜰᴜʟ ᴛᴏ ᴏᴛʜᴇʀ ᴘʟᴀʏᴇʀꜱ."
    - "<gray>2. ɴᴏ ᴄʜᴇᴀᴛɪɴɢ, ᴇxᴘʟᴏɪᴛɪɴɢ ᴏʀ ɢʀɪᴇꜰɪɴɢ."
    - "<gray>3. ʜᴀᴠᴇ ꜰᴜɴ!"
  motd:
    - "<gradient:#43C6AC:#4FC3F7><bold>ᴡᴇʟᴄᴏᴍᴇ ᴛᴏ ꜱᴏᴜʀʙʏᴄʀᴀꜰᴛ</bold></gradient>"
    - "<gray>ᴛʏᴘᴇ <#FFD54F>/ʀᴜʟᴇꜱ <gray>ᴛᴏ ɢᴇᴛ ꜱᴛᴀʀᴛᴇᴅ."

# ----------------------------------------------------------------------------
#  Join / leave & first-join
# ----------------------------------------------------------------------------

# Custom join/quit messages (join-messages module). When enabled, replaces the
# vanilla messages. The <player> placeholder is substituted (as a literal component,
# so names can't inject formatting). Legacy %player% is also accepted.
join-messages:
  enabled: false
  # Suppress join/quit messages entirely (overrides the strings below).
  silent: false
  first-join: "<yellow>Welcome <white><player></white> to the server!"
  join: "<gray><player> joined."
  quit: "<gray><player> left."

# First-join actions (first-join module) — runs once, the first time a player
# ever joins.
first-join:
  enabled: true
  # Teleport the new player to spawn on first join.
  teleport-to-spawn: true
  # Private welcome message shown to the new player ("" = none).
  welcome: ""
  # Console commands run once on first join. {player} is substituted.
  commands: []
  #  - "give {player} minecraft:bread 16"

# Every-join behaviours (joinbehavior module) — unlike first-join, these run on
# EVERY join/quit. All off by default.
join:
  # Teleport each joining player to spawn (/setspawn location, or the player's
  # world spawn if none is set). Distinct from first-join.teleport-to-spawn.
  teleport-spawn: false
  # Play a sound to everyone online when a player joins or quits.
  sound-enabled: false
  # Minecraft sound registry keys (namespace optional, defaults to minecraft:).
  join-sound: "entity.player.levelup"
  quit-sound: "block.note_block.bass"

# Staff join/leave notifications (notify module) — pings staff with
# sessentials.notify when players connect/disconnect.
notify:
  join-leave: false

# ----------------------------------------------------------------------------
#  AFK
# ----------------------------------------------------------------------------

# Auto-AFK on idle (identity module). After this many seconds with no activity
# (moving to a new block, chat, commands, interaction) a player is automatically
# marked AFK — the same "is now AFK" broadcast manual /afk sends — and unmarked
# again on their next activity. This only marks/unmarks AFK; idle KICKING is the
# separate afk-kick module's job. Set to 0 to disable auto-AFK (manual /afk still
# works).
afk:
  auto-seconds: 300

# ----------------------------------------------------------------------------
#  Protection
# ----------------------------------------------------------------------------

# Passive protection behaviours (protection module).
protection:
  # Cancel void damage to players and teleport them to spawn instead
  # (the /setspawn location, or the world spawn if none is set).
  void-teleport: true
  # Cancel natural/patrol phantom spawns (spawn eggs, spawners and
  # commands still work).
  no-phantoms: false

# ----------------------------------------------------------------------------
#  Chat
# ----------------------------------------------------------------------------

# Chat format rewrite (chat-format module). When enabled, formats every chat
# line. {player} = name, {message} = message. Leave disabled to let another
# chat plugin own formatting.
chat-format:
  enabled: false
  format: "<gray>{player}<dark_gray> » <white>{message}"

# Word filter (chat-filter module).
chat-filter:
  enabled: true
  # "censor" replaces the word with asterisks; "block" cancels the whole message.
  action: censor
  banned-words: []
  #  - badword

# Anti-spam (anti-spam module) — rate-limits chat.
anti-spam:
  enabled: true
  # Minimum seconds between two messages from the same player.
  cooldown-seconds: 2
  # Also block sending the exact same message twice in a row.
  block-repeat: true

# Local/proximity chat (local-chat module) — /localchat toggles per-player.
local-chat:
  enabled: false
  # Radius (blocks) a local message reaches.
  radius: 100

# Colour limits (color-limits module) — restricts who may use colour codes in
# chat to players with sessentials.color permissions.
color-limits:
  enabled: false

# Emoji substitution (emoji module) — replaces :key: tokens in chat with the
# mapped text/glyph. Requires sessentials.emoji.
emoji:
  enabled: true
  map:
    shrug: "¯\\_(ツ)_/¯"
    heart: "❤"
    star: "★"
    check: "✔"
    cross: "✖"
    arrow: "➜"

# ----------------------------------------------------------------------------
#  Death & combat
# ----------------------------------------------------------------------------

# Death messages (deathmessages module).
deathmessages:
  enabled: true
  # Hide all death messages server-wide.
  hide: false

# Combat tagging (combat module) — blocks teleport/logout while in combat.
combat:
  enabled: true
  # How long (seconds) a player stays combat-tagged after taking/dealing PvP damage.
  tag-seconds: 15

# HP bar (hpbar module) — shows a target's health in the action bar on hit.
hpbar:
  enabled: true

# Floating damage numbers (damage-indicator module) — a short-lived holographic
# number pops above an entity when it takes damage.
damage-indicator:
  enabled: true

# Elevator signs (elevatorsigns module) — right-click a sign whose first line is
# "[Up]" or "[Down]" (also "[Lift Up]"/"[Lift Down]"; case-insensitive, brackets
# optional) to jump to the next elevator sign above/below in the same column.
elevator:
  enabled: true
  # Maximum vertical distance (blocks) to search for the destination sign.
  range: 64

# ----------------------------------------------------------------------------
#  World & respawn behaviours (worldbehavior module)
#  Passive, config-driven automations — this module has no commands. Everything
#  below is off/empty by default, so an untouched config leaves it fully inert.
# ----------------------------------------------------------------------------

# Force a game mode per world. Each key is a world name (matched case-insensitively)
# and the value is SURVIVAL, CREATIVE, ADVENTURE or SPECTATOR. The mode is applied
# when a player joins into that world and whenever they change into it. Unlisted
# worlds are never touched; an unknown mode name is logged and ignored.
world-gamemode: {}
#  hub: ADVENTURE
#  creative: CREATIVE

world-behavior:
  # Teleport players to the new world's spawn whenever they change worlds. Prefers
  # the /setspawn location when it lies in that world, else the world's own spawn.
  spawn-on-change: false

respawn:
  # Redirect respawns to the global /setspawn location (only when a spawn is set).
  # A player's bed / respawn anchor is otherwise left alone. Health and food are
  # already restored by vanilla on respawn.
  at-spawn: false
  # Console commands run each time a player respawns. {player} is substituted.
  commands: []
  #  - "give {player} minecraft:torch 8"

# ----------------------------------------------------------------------------
#  Economy features
# ----------------------------------------------------------------------------

# Built-in economy provider (economyprovider module). SEssentials can serve as the
# server's Vault economy backend from its own balance store (economy.yml). It registers
# at Vault priority LOW, so while another provider such as CMI is installed that provider
# stays active and these settings are dormant; once CMI is removed SEssentials becomes the
# active provider and serves the migrated balances. Migrate balances first with
# `/sess import cmi` (or `import essentials`) — that writes into this store directly.
economy:
  # Balance handed to an account the first time it is seen (when none exists yet).
  starting-balance: 0.0
  # Currency symbol shown before an amount, e.g. "$1,234.50 coins".
  symbol: "$"
  # Currency name shown after an amount (singular used only for exactly 1).
  currency-singular: "coin"
  currency-plural: "coins"

# Coinflip gambling (coinflip module).
coinflip:
  # Maximum bet per flip.
  max-bet: 1000000

# Lottery (lottery module).
lottery:
  enabled: false
  # Ticket price (accepts a plain number).
  ticket-price: "1000"
  # Seconds between automatic draws.
  draw-interval-seconds: 3600

# Anvil repair cost (anvil-cost module) — caps or overrides vanilla anvil XP cost.
anvil-cost:
  enabled: false
  # Maximum XP levels an anvil operation may cost (0 = free).
  max-cost: 0

# ----------------------------------------------------------------------------
#  Broadcasts
# ----------------------------------------------------------------------------

# Rotating auto-broadcasts (autobroadcast module).
autobroadcast:
  enabled: true
  # Seconds between broadcasts.
  interval-seconds: 300
  messages:
    - "<gray>Type <#FFD54F>/help</#FFD54F> for commands."
    - "<gray>Set a home with <#FFD54F>/sethome</#FFD54F>."

# ----------------------------------------------------------------------------
#  Restrictions & enchanting
# ----------------------------------------------------------------------------

# Disable-enchant (disable-enchant module) — stops the listed enchantments from
# being applied at enchant tables/anvils. Use lowercase Minecraft enchant keys.
disable-enchant:
  enabled: false
  blocked: []
  #  - mending
  #  - sharpness

